events {}

http {
  server {
    listen 8080;

    # Settings shared by every proxied API route.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
      return 200 "ok\n";
    }

    location /api/auth/ {
      proxy_pass http://auth-service:5001;
    }

    location /api/notes/shared/ {
      # /api/notes/shared/<token> becomes /api/reveal/<token>.
      proxy_pass http://reveal-service:5003/api/reveal/;
    }

    location /api/notes {
      proxy_pass http://note-service:5002;
    }

    location / {
      return 404;
    }
  }
}
