services:
  frontend:
    build: ./apps/frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5001
    depends_on:
      api-gateway:
        condition: service_healthy

  auth-service:
    build: ./services/auth/backend
    expose:
      - "5001"
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/invisinotes
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or Invisi/.env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL_PREVIEW: ${FRONTEND_URL_PREVIEW:-}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  note-service:
    build: ./services/note/backend
    expose:
      - "5002"
    environment:
      PORT: 5002
      MONGO_URI: mongodb://mongo:27017/invisinotes
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or Invisi/.env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL_PREVIEW: ${FRONTEND_URL_PREVIEW:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  reveal-service:
    build: ./services/reveal/backend
    expose:
      - "5003"
    environment:
      PORT: 5003
      NOTE_SERVICE_URL: http://note-service:5002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL_PREVIEW: ${FRONTEND_URL_PREVIEW:-}
    depends_on:
      note-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  notification-worker:
    build: ./workers/notification
    environment:
      NOTE_SERVICE_URL: http://note-service:5002
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    depends_on:
      note-service:
        condition: service_healthy

  load-balancer:
    image: nginx:1.28-alpine
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "8080"
    depends_on:
      auth-service:
        condition: service_healthy
      note-service:
        condition: service_healthy
      reveal-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 5

  api-gateway:
    build: ./gateway
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      BACKEND_URL: http://load-balancer:8080
      REDIS_URL: redis://redis:6379
    depends_on:
      load-balancer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok ? quit(0) : quit(1)"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
